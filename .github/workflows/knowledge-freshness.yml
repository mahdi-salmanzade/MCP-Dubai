name: Knowledge freshness

# Content rot is the failure mode this project is most exposed to: seven packs
# went 3.5 months stale before a human noticed. This job checks domain age on
# a schedule and opens (or updates) a tracking issue when any full review is
# overdue. It deliberately does NOT run on pull requests: a PR touching
# unrelated code should not fail because a knowledge pack aged out.

on:
  schedule:
    # 05:00 UTC = 09:00 Asia/Dubai, every Monday.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Do not overlap scheduled and manually dispatched refresh checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freshness:
    name: Check knowledge pack age
    runs-on: ubuntu-latest
    outputs:
      overdue: ${{ steps.report.outputs.overdue }}
      report: ${{ steps.report.outputs.report }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Report freshness
        id: report
        run: |
          {
            echo 'report<<FRESHNESS_EOF'
            python scripts/check_knowledge_freshness.py
            echo 'FRESHNESS_EOF'
          } >> "$GITHUB_OUTPUT"
          # Separate strict run so the report is captured either way.
          if python scripts/check_knowledge_freshness.py --strict > /dev/null; then
            echo "overdue=false" >> "$GITHUB_OUTPUT"
          else
            echo "overdue=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Print report to the run log
        run: python scripts/check_knowledge_freshness.py

  report-issue:
    name: Report overdue knowledge packs
    needs: freshness
    if: needs.freshness.outputs.overdue == 'true'
    runs-on: ubuntu-latest
    # This job does not check out or execute repository code. Its sole purpose
    # is to create or update the repository's freshness tracking issue.
    permissions:
      contents: read
      issues: write  # Required to create or update the overdue knowledge-pack tracking issue.
    steps:
      - name: Open or update the tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT: ${{ needs.freshness.outputs.report }}
        with:
          script: |
            const title = 'Knowledge domains overdue for full review';
            const body = [
              'One or more knowledge domains are past their full-review budget.',
              '',
              'Re-verify each overdue domain in full against its `verify_at` source,',
              'correct changed figures, then advance both `knowledge_date` and',
              '`full_review_date`. A targeted update may advance `knowledge_date` but',
              'must preserve `full_review_date`. If a domain genuinely moves more',
              'slowly than its declared `volatility` implies, downgrade the volatility',
              'instead of repeatedly re-stamping it.',
              '',
              '```',
              process.env.REPORT,
              '```',
              '',
              `_Generated by the knowledge-freshness workflow, run ${context.runId}._`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'knowledge-freshness',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              core.info(`Updated issue #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['knowledge-freshness'],
              });
              core.info(`Opened issue #${created.data.number}`);
            }
