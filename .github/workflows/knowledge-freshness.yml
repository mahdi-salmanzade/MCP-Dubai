name: Knowledge freshness

# Content rot is the failure mode this project is most exposed to: seven packs
# went 3.5 months stale before a human noticed. This job checks pack age on a
# schedule and opens (or updates) a single tracking issue when any pack is
# overdue. It deliberately does NOT run on pull requests: a PR touching
# unrelated code should not fail because a knowledge pack aged out.

on:
  schedule:
    # 05:00 UTC = 09:00 Asia/Dubai, every Monday.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    name: Check knowledge pack age
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Report freshness
        id: report
        run: |
          {
            echo 'report<<FRESHNESS_EOF'
            python scripts/check_knowledge_freshness.py
            echo 'FRESHNESS_EOF'
          } >> "$GITHUB_OUTPUT"
          # Separate strict run so the report is captured either way.
          if python scripts/check_knowledge_freshness.py --strict > /dev/null; then
            echo "overdue=false" >> "$GITHUB_OUTPUT"
          else
            echo "overdue=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Print report to the run log
        run: python scripts/check_knowledge_freshness.py

      - name: Open or update the tracking issue
        if: steps.report.outputs.overdue == 'true'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.report.outputs.report }}
        with:
          script: |
            const title = 'Knowledge packs overdue for re-verification';
            const body = [
              'One or more curated knowledge packs are past their freshness budget.',
              '',
              'Re-verify each overdue pack against its `verify_at` source, correct any',
              'changed figures, then bump its `knowledge_date`. If a pack genuinely',
              'moves more slowly than its declared `volatility` implies, downgrade the',
              'volatility instead of repeatedly re-stamping it.',
              '',
              '```',
              process.env.REPORT,
              '```',
              '',
              `_Generated by the knowledge-freshness workflow, run ${context.runId}._`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'knowledge-freshness',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              core.info(`Updated issue #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['knowledge-freshness'],
              });
              core.info(`Opened issue #${created.data.number}`);
            }
