name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

# Never run two publication attempts for the same ref concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build==1.5.0 twine==7.0.0

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distributions
        run: twine check dist/*

      - name: Upload distributions artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 14

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    # Published GitHub releases keep their deliberate tag-based flow. A manual
    # production publish is limited to main, while TestPyPI remains available
    # from development branches below.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'pypi' &&
      github.ref == 'refs/heads/main')

    # Use PyPI Trusted Publishing (recommended). Configure at:
    # https://pypi.org/manage/account/publishing/
    # No PyPI API token needed once trusted publishing is set up.
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing through GitHub OIDC.

    environment:
      name: pypi
      url: https://pypi.org/p/mcp-dubai

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          # Skip existing in case the same version is re-uploaded.
          skip-existing: true

  publish-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: publish-pypi

    # GitHub OIDC login authorizes the io.github.<repo-owner> namespace,
    # which must match the "name" in server.json.
    permissions:
      id-token: write  # Required to authenticate mcp-publisher through GitHub OIDC.
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync server.json version with pyproject.toml
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          MCP_PUBLISHER_VERSION="v1.8.1"
          MCP_PUBLISHER_ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${MCP_PUBLISHER_ARCHIVE}" \
            --output "${MCP_PUBLISHER_ARCHIVE}"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  ${MCP_PUBLISHER_ARCHIVE}" \
            | sha256sum --check --strict
          tar -xzf "${MCP_PUBLISHER_ARCHIVE}" mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'

    permissions:
      id-token: write  # Required for TestPyPI Trusted Publishing through GitHub OIDC.

    environment:
      name: testpypi
      url: https://test.pypi.org/p/mcp-dubai

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
