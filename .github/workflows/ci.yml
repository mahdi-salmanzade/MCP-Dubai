name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs of the same workflow on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data]"

      - name: Lint with ruff
        run: ruff check src tests scripts

      - name: Format check with ruff
        run: ruff format --check src tests scripts

      - name: Type check with mypy (strict)
        run: mypy src

      - name: Run pytest
        run: pytest --cov=src/mcp_dubai --cov-report=xml --cov-report=term

      - name: Em-dash sweep
        shell: bash
        run: |
          # Hard project rule: no em dashes (U+2014) or en dashes (U+2013)
          # anywhere in the shipped source tree. The rule is documented in
          # CONTRIBUTING.md and the PR template, which are exempted because
          # they document the rule itself.
          if grep -RIn $'[\u2014\u2013]' src tests scripts pyproject.toml README.md DISCLAIMER.md Makefile .env.example 2>/dev/null; then
            echo "::error::Em dash or en dash found in shipped files. Use a hyphen, colon, or two sentences."
            exit 1
          fi
          echo "OK: no em or en dashes in shipped files."

      # Informational only. Content going stale is the maintainer's cue to
      # re-verify, not a reason to fail a PR that touched unrelated code. The
      # blocking checks live in tests/test_biz/test_knowledge_freshness.py and
      # the weekly knowledge-freshness workflow opens a tracking issue.
      - name: Knowledge freshness report (informational)
        if: matrix.python-version == '3.12'
        run: python scripts/check_knowledge_freshness.py

      - name: Smoke test (server boots)
        run: |
          python -c "from mcp_dubai.server import mcp, list_features; print('server:', mcp.name); print('features:', len(list_features()))"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build==1.5.0 twine==7.0.0

      - name: Build distributions
        run: python -m build

      - name: Check distributions with twine
        run: twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
